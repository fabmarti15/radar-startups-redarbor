<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Radar · Startups para Redarbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
    --bg:#ffffff;--surface:#fff;--paper:#fafafa;--text:#141414;--ink:#141414;--muted:#5c5c5c;--soft:#8a8a8a;
    --line:#e2e2e2;--hair:#ececec;--accent:#1d4ed8;--accent2:#1d4ed8;--accentSoft:#eef3fd;--accentTint:#f4f7fe;
    --red:#dc2626;--redSoft:#fdf1f1;--green:#1d4ed8;--amber:#141414;--gold:#d4a017;
    --sans:'IBM Plex Sans',-apple-system,'Helvetica Neue',Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font:14.5px/1.55 var(--sans);padding:28px 24px 90px;font-variant-numeric:tabular-nums}
  ::selection{background:var(--accent);color:#fff}
  .wrap{max-width:1040px;margin:0 auto}
  #detail.wrap{max-width:860px}
  .hide{display:none!important}
  h1{font-family:var(--sans);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--ink);padding-top:14px;border-top:2px solid var(--ink)}
  .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:8px;letter-spacing:.02em}
  section{margin-top:36px}
  h2{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500;padding-bottom:8px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:7px;height:7px;background:var(--accent);flex-shrink:0}
  .mode{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:4px}

  #pin{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center}
  #pin .box{text-align:center;padding:34px 36px;border:1px solid var(--ink);min-width:300px}
  #pin h1{border-top:0;padding-top:0;font-size:22px}
  #pin input{border:1px solid var(--ink);border-radius:2px;padding:12px;font-size:17px;text-align:center;width:220px;background:#fff;margin-top:18px;font-family:var(--mono);letter-spacing:.2em;color:var(--ink);outline:none}
  #pin input:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  #pin .err{color:var(--red);font-size:12.5px;margin-top:10px;visibility:hidden;font-family:var(--mono)}
  #pin .err.show{visibility:visible}
  #pin .cry{margin-top:22px;font-family:var(--mono);font-size:10px;color:var(--soft);letter-spacing:.08em;text-transform:uppercase}

  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:#fff;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:0}
  .kpi{padding:18px 12px 14px;text-align:left;border-radius:0;border-left:1px solid var(--line)}
  .kpi:first-child{border-left:0;padding-left:0}
  .kpi:last-child{border-right:1px solid var(--line)}
  .kpi .n{font-family:var(--mono);font-size:36px;font-weight:500;line-height:1;color:var(--ink);display:block;letter-spacing:-.02em}
  .kpi.alert .n{color:var(--red)}
  .kpi .l{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:8px}
  .home-kpis{margin-top:28px}

  .filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .fchip{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 11px;border-radius:2px;border:1px solid var(--line);color:var(--muted);background:#fff;cursor:pointer;line-height:1.2;transition:border-color .12s,color .12s}
  .fchip:hover{border-color:var(--ink);color:var(--ink)}
  .fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  select{font:11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:2px;padding:6px 8px;cursor:pointer}
  select:hover{border-color:var(--ink);color:var(--ink)}
  .fcount{font-family:var(--mono);font-size:11px;color:var(--soft);margin-left:auto}

  .idea-groups{margin-top:24px}
  .idea-group{margin-top:24px}
  .idea-group:first-child{margin-top:0}
  .idea-group-note{font-family:var(--mono);font-size:10.5px;color:var(--soft)}
  .table-top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:8px}
  .table-top h2{margin:0;padding-bottom:0}
  .idea-table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-top:1px solid var(--ink);border-radius:0;background:#fff;box-shadow:none}
  .idea-table{width:100%;min-width:940px;border-collapse:separate;border-spacing:0;font-size:12.5px}
  .idea-table th{position:relative;background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--ink);white-space:nowrap}
  .idea-table th,.idea-table td{padding:9px 7px;text-align:center;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .idea-table th:last-child,.idea-table td:last-child{border-right:0}
  .idea-table tbody tr:last-child td{border-bottom:0}
  .idea-table tbody tr{cursor:pointer}
  .idea-table tbody tr:hover td,.idea-table tbody tr:hover .idea-col{background:var(--accentTint)}
  .idea-table tbody tr.alertrow td:first-child{box-shadow:inset 3px 0 0 var(--red)}
  .idea-table .idea-col{text-align:left;position:sticky;left:0;z-index:3;background:#fff;min-width:190px;max-width:210px;padding-left:12px;border-right:1px solid var(--line)}
  .idea-table th.idea-col{z-index:5;background:var(--paper)}
  .idea-name{font-size:12.5px;line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink)}
  .idea-sub{display:block;font-family:var(--mono);font-size:10.5px;color:var(--soft);font-weight:400;margin-top:3px;letter-spacing:.01em;white-space:normal;line-height:1.35}
  .alertmini{display:block;font-family:var(--mono);color:var(--red);font-size:9.5px;margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
  .sortbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:inherit;font:inherit;font-weight:inherit;padding:0;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
  .sortbtn:hover{color:var(--ink)}
  .sortbtn.active{color:var(--accent);font-weight:600}
  .scorecell{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--accent)}
  .scorecell.low{color:var(--red)}
  .star{color:var(--gold);font-size:9px;margin-left:2px;vertical-align:2px}
  .criterion-cell{font-family:var(--mono);font-size:12.5px;color:var(--text)}
  .idea-table svg.radar{width:54px;height:54px;margin:auto}
  .rwrap{display:inline-block}
  .radarbtn{display:block;border:0;background:none;padding:0;color:inherit;cursor:pointer;border-radius:2px}
  .radarbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  svg.radar{display:block;flex-shrink:0}
  .tipitem{position:relative;padding:6px 0 6px 12px;border-top:1px solid var(--hair)}
  .tipitem:before{content:'';position:absolute;left:0;top:12px;width:5px;height:5px;background:var(--accent)}
  .tipitem b{display:block;color:var(--ink);font-weight:600;font-family:var(--mono);font-size:11px}
  .tipitem span{display:block;color:var(--muted)}
  .tipitem em{display:block;color:var(--soft);font-style:normal;margin-top:2px}
  .chip{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:2px;border:1px solid var(--line);color:var(--muted);background:#fff;flex-shrink:0;display:inline-block;line-height:1.4}
  .chip.a{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.b{border-color:var(--ink);color:var(--ink);font-weight:500}
  .chip.c{border-color:var(--line);color:var(--soft);background:var(--paper)}
  .empty{color:var(--soft);font-size:13.5px;padding:14px 0;font-family:var(--mono)}

  .back{background:none;border:none;color:var(--muted);font:12px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:0 0 18px;cursor:pointer}
  .back:hover{color:var(--accent)}
  .dhead h1{font-size:28px}
  .dchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
  .dq{margin-top:16px;font-size:16px;line-height:1.5;color:var(--ink);max-width:680px}
  .scorebox{display:flex;align-items:center;gap:24px;margin-top:22px;background:#fff;border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);border-radius:0;padding:18px 0;box-shadow:none}
  .scorebox .big{font-family:var(--mono);font-size:60px;font-weight:500;color:var(--ink);line-height:1;letter-spacing:-.03em}
  .scorebox .big.low{color:var(--red)}
  .scorebox .u{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:8px}
  .scorebox svg.radar{width:170px;height:170px;margin-left:auto;margin-right:18px;overflow:visible}

  .tblwrap{width:100%;overflow-x:auto;margin:16px 0 0;border-top:1px solid var(--ink)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{border:1px solid var(--hair);padding:9px 10px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
  .tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
  .tbl th:first-child,.tbl td:first-child{border-left:0}
  .tbl th:last-child,.tbl td:last-child{border-right:0}
  .tbl th{background:var(--paper);font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .tbl.crit tr:first-child th{border-bottom:1px solid var(--ink)}
  .tbl.facts th{width:38%;text-transform:none;letter-spacing:.02em;font-size:12px;padding-top:11px}
  .crit td:first-child{width:34%}
  .crit td:last-child{color:var(--muted);font-size:12.5px}
  .hv{border-bottom:1px dotted var(--accent);cursor:help;color:inherit;background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit;text-align:left;display:inline}
  .hv:hover{color:var(--accent)}
  .hv:focus{outline:none;background:var(--accentSoft)}
  .critname{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:help;text-align:left;border-bottom:1px dotted var(--soft)}
  .critname:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .critw{display:block;font-family:var(--mono);font-size:10px;color:var(--soft);font-weight:400;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
  .bar{display:flex;align-items:center;gap:8px}
  .bar .track{flex:1;height:8px;background:var(--hair);border-radius:0;overflow:hidden;min-width:44px}
  .bar .fill{height:100%;background:var(--accent);border-radius:0}
  .bar .fill.low{background:var(--red)}
  .bar .v{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);min-width:18px;text-align:right}

  .blk{margin-top:22px;background:#fff;border:0;border-left:2px solid var(--ink);border-radius:0;padding:4px 0 4px 16px;box-shadow:none}
  .blk h3{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink);font-weight:500;margin-bottom:8px}
  .blk.risk{border-left-color:var(--red)}
  .blk.risk h3{color:var(--red)}
  .blk.claude{background:var(--accentSoft);border:1px solid #d5e0f8;border-left:2px solid var(--accent);padding:14px 16px}
  .blk.claude h3{color:var(--accent)}
  .blk p{font-size:14px;line-height:1.6;color:var(--text)}
  .links{margin-top:22px;display:flex;flex-direction:column;gap:8px}
  .links a{font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);align-self:flex-start;padding-bottom:1px}
  .links a:hover{color:var(--ink);border-color:var(--ink)}

  .pre{white-space:pre-line}
  #tip{position:fixed;display:none;z-index:120;width:320px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain;background:#fff;border:1px solid var(--ink);border-radius:2px;box-shadow:none;padding:12px 14px;font-size:12.5px;line-height:1.45;color:var(--text)}
  #tip.show{display:block}
  #tip h4{font-size:13px;font-weight:600;margin-bottom:3px;color:var(--ink)}
  #tip .w{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:500;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
  #tip .d{color:var(--text);margin-bottom:7px}
  #tip .e{color:var(--muted);font-style:italic;margin-bottom:7px}
  #tip .h{color:var(--muted);font-size:11.5px;border-top:1px solid var(--hair);padding-top:7px}

  .method-panel{display:block;margin-top:40px;background:#fff;border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
  .method-panel summary{list-style:none;padding:14px 0;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px}
  .method-panel summary::before{content:"+";font-size:14px;color:var(--accent);width:10px;font-weight:600}
  .method-panel[open] summary::before{content:"–"}
  .method-panel summary:hover{color:var(--ink)}
  .method-panel summary::-webkit-details-marker{display:none}
  .method-panel[open] summary{border-bottom:1px solid var(--line)}
  .method-content{padding:16px 0}
  .method-content p{font-size:13.5px;color:var(--text);margin-bottom:10px;line-height:1.6}
  .method-content p b{color:var(--ink);font-weight:600}
  .wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 18px}
  .wgrid button{background:#fff;border:1px solid var(--line);border-radius:2px;padding:10px 8px;text-align:left;cursor:help;font:inherit}
  .wgrid button:hover{border-color:var(--accent)}
  .wgrid .wn{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
  .wgrid .wv{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--accent);line-height:1.2;display:block;margin-top:4px}
  .ctxgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
  .ctxgrid div{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:12px 14px}
  .ctxgrid span{display:block;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;margin-bottom:6px}
  .ctxgrid p{font-size:12.5px;color:var(--text);margin:0;line-height:1.5}
  .site-footer{padding:36px 0 10px;text-align:left;font-family:var(--mono);color:var(--soft);font-size:11px;letter-spacing:.02em;border-top:1px solid var(--line);margin-top:30px}
  @media(max-width:700px){
    body{padding:20px 16px 60px}
    h1{font-size:24px;line-height:1.15}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .kpi{padding:14px 10px 12px}
    .kpi:nth-child(3){border-left:0;padding-left:0}
    .kpi:nth-child(n+3){border-top:1px solid var(--line)}
    .kpi .n{font-size:30px}
    .ctxgrid,.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .fcount{margin-left:0;width:100%}
    svg.radar{width:52px;height:52px}
    .scorebox svg.radar{width:120px;height:120px}
    .scorebox .big{font-size:44px}
    .crit td:first-child{width:40%}
    #tip{left:12px!important;right:12px;width:auto;bottom:12px;top:auto!important}
  }
  .idea-table th:nth-child(3),.idea-table td:nth-child(3){white-space:nowrap}
  .idea-table svg.radar polygon[fill="#1d4ed8"]{fill-opacity:.22;stroke-width:2}
  .scorebox svg.radar polygon[fill="#1d4ed8"]{fill-opacity:.16;stroke-width:2}
  svg.radar{overflow:visible}
</style>
</head>
<body>

<div id="pin">
  <div class="box">
    <h1>Radar · Startups</h1>
    <div class="sub">Esto va cifrado. Pideme la clave</div>
    <input id="pinInput" type="password" placeholder="clave" autocomplete="off">
    <div class="err" id="pinErr">Clave incorrecta</div>
    <div class="cry">AES-256-GCM · PBKDF2-SHA256 · 200.000 iteraciones</div>
  </div>
</div>

<div class="wrap hide" id="home">
  <h1>Startups q podriamos comprar de verdad</h1>
  <div class="sub">Techo de USD 20M · evaluadas con el framework de Ideas 2027</div>
  <div class="mode" id="mode"></div>
  <section class="home-kpis"><div class="kpis" id="kpis"></div></section>
  <section>
    <h2>Filtrar por precio</h2>
    <div class="filters" id="filters"></div>
  </section>
  <section class="idea-groups"><div id="list"></div></section>
  <details class="method-panel">
    <summary>El framework, el contexto y lo q no sabemos</summary>
    <div class="method-content" id="method"></div>
  </details>
  <footer class="site-footer" id="foot"></footer>
</div>

<div class="wrap hide" id="detail"></div>

const KEYNAME="radar_redarbor_pw";
let P=null,C=null,W=null,SHORT=null;

async function unlock(pw){
  const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},k,ct)));
}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>n.toFixed(1).replace(".",",");
const TIERN={A:"A · llamar ya",B:"B · mirar bien",C:"C · apuesta chica"};
const TIERNOTE={A:"Precio alcanzable y tapan un hueco q tenemos hoy",B:"Vale la reunion, pero hay algo q resolver antes",C:"Barata o dudosa: se compra por el equipo o por la cartera"};
const TKO={"Bajo 5M":0,"5 a 12M":1,"12 a 20M":2,"Al filo":3},TRO={A:0,B:1,C:2};
const ALERT=6;
const st={tk:"Todos",geo:"Todas",cat:"Todas",sort:"score"};
const score=x=>x.sc.reduce((a,v,i)=>a+v*W[i],0)/100;

/* ---- radar, calcado del framework de Ideas 2027 ---- */
function radarSVG(polys,size,labels){
  const Wd=size||120,cx=Wd/2,cy=Wd/2*(labels?0.94:1),R=Wd/2*(labels?0.62:0.86),N=C.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return (cx+Math.cos(a)*R*v/10).toFixed(1)+","+(cy+Math.sin(a)*R*v/10).toFixed(1)};
  let h="";
  for(let r=2.5;r<=10;r+=2.5)h+='<polygon fill="none" stroke="#e2e2e2" points="'+[...Array(N).keys()].map(i=>pt(i,r)).join(" ")+'"/>';
  if(labels)C.forEach((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/N;
    h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(a)*R).toFixed(1)+'" y2="'+(cy+Math.sin(a)*R).toFixed(1)+'" stroke="#e2e2e2"/>';
    const lx=cx+Math.cos(a)*(R+15),ly=cy+Math.sin(a)*(R+15);
    const anc=Math.abs(Math.cos(a))<.3?"middle":(Math.cos(a)>0?"start":"end");
    h+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="'+anc+'" font-size="9" fill="#8a8a8a">'+SHORT[i]+'</text>';});
  polys.forEach(p=>{if(!p.vals.some(v=>v>0))return;
    h+='<polygon points="'+p.vals.map((v,i)=>pt(i,v||0)).join(" ")+'" fill="'+p.col+'" fill-opacity="'+(p.dash?0:0.10)+'" stroke="'+p.col+'" stroke-width="1.5"'+(p.dash?' stroke-dasharray="4 3"':"")+'/>';});
  return '<svg class="radar" viewBox="0 0 '+Wd+' '+Wd+'">'+h+'</svg>';
}
const avgVals=()=>C.map((_,i)=>P.d.reduce((a,x)=>a+x.sc[i],0)/P.d.length);

function boot(data){
  P=data;C=P.crit;W=C.map(c=>c.weight);SHORT=C.map(c=>c.short);
  $("pin").classList.add("hide");
  $("mode").textContent="Las notas las puso Claude, escritas con mi voz · agosto 2026";
  $("foot").textContent=P.foot;
  kpis();filters();method();route();
}
function kpis(){
  const d=P.d,sc=d.map(score);
  const k=[[d.length,"en el radar"],[num(sc.reduce((a,b)=>a+b,0)/sc.length),"promedio"],
    [sc.filter(v=>v>=7).length,"sobre 7,0"],[sc.filter(v=>v<ALERT).length,"bajo 6,0",1]];
  $("kpis").innerHTML=k.map(([n,l,al])=>`<div class="kpi${al?" alert":""}"><span class="n">${n}</span><div class="l">${l}</div></div>`).join("");
}
function filters(){
  const uniq=key=>[...new Set(P.d.map(x=>x[key]))].sort();
  let h="";
  ["Todos","Bajo 5M","5 a 12M","12 a 20M","Al filo"].forEach(v=>{h+=`<button class="fchip" data-v="${v}" aria-pressed="${st.tk===v}">${v}</button>`});
  h+=`<select data-k="geo">`+["Todas",...uniq("geo")].map(v=>`<option${st.geo===v?" selected":""}>${v}</option>`).join("")+`</select>`;
  h+=`<select data-k="cat">`+["Todas",...uniq("cat")].map(v=>`<option${st.cat===v?" selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  h+=`<span class="fcount" id="fcount"></span>`;
  const f=$("filters");f.innerHTML=h;
  f.querySelectorAll(".fchip").forEach(b=>b.onclick=()=>{st.tk=b.dataset.v;filters()});
  f.querySelectorAll("select").forEach(s=>s.onchange=()=>{st[s.dataset.k]=s.value;list()});
  list();
}
const match=x=>(st.tk==="Todos"||x.tk===st.tk)&&(st.geo==="Todas"||x.geo===st.geo)&&(st.cat==="Todas"||x.cat===st.cat);
const stars=v=>v>8?'<span class="star">★</span>':"";

/* ---- tabla del home, calcada de la idea-table de Ideas 2027 ---- */
let sortKey="total",sortDir="desc";
function sortHeader(key,label,crit){
  const active=sortKey===key,arrow=active?(sortDir==="desc"?"↓":"↑"):"";
  return `<button class="sortbtn${active?" active":""}"${crit!=null?` data-c="${crit}"`:""} onclick="sortTableBy(event,'${key}')">${label} <span>${arrow}</span></button>`;
}
function sortTableBy(e,key){
  e.stopPropagation();
  if(sortKey===key)sortDir=sortDir==="desc"?"asc":"desc";else{sortKey=key;sortDir=key==="n"?"asc":"desc"}
  list();
}
function sortVal(x,key){
  if(key==="total")return score(x);
  if(key==="n")return x.n.toLowerCase();
  if(key==="tier")return -TRO[x.tier];
  if(key==="tk")return -TKO[x.tk];
  return x.sc[C.findIndex(c=>c.id===key)];
}
function miniRadar(x){
  return `<span class="rwrap"><button type="button" class="radarbtn" data-r="${P.d.indexOf(x)}" aria-label="Ver desglose de ${esc(x.n)}">`+
    radarSVG([{vals:avgVals(),col:"#c4c4c4",dash:1},{vals:x.sc,col:"#1d4ed8"}],120,0)+`</button></span>`;
}
function list(){
  const r=P.d.filter(match);
  const dir=sortDir==="desc"?-1:1;
  r.sort((a,b)=>{const va=sortVal(a,sortKey),vb=sortVal(b,sortKey);
    return (typeof va==="string"?va.localeCompare(vb):va-vb)*dir||a.n.localeCompare(b.n)});
  const fc=$("fcount");if(fc)fc.textContent=r.length+" de "+P.d.length;
  if(!r.length){$("list").innerHTML='<div class="empty">Ninguna compañía cumple ese cruce de filtros.</div>';return}
  const heads=C.map((c,i)=>`<th>${sortHeader(c.id,esc(c.short),i)}</th>`).join("");
  const header=`<thead><tr><th class="idea-col">${sortHeader("n","Compañía")}</th>`+
    `<th>${sortHeader("tier","Prior.")}</th><th>${sortHeader("tk","Precio")}</th>`+
    `<th>${sortHeader("total","Total")}</th><th>Araña</th>${heads}</tr></thead>`;
  const row=x=>{const s=score(x),idx=P.d.indexOf(x);
    return `<tr onclick="location.hash='s${idx}'" class="${s<ALERT?"alertrow":""}">
      <td class="idea-col" title="${esc(x.n)} · ${esc(x.q)}">
        <span class="idea-name">${esc(x.n)}</span>
        <span class="idea-sub">${esc(x.g)} · ${esc(x.cat)}</span>
        ${s<ALERT?'<span class="alertmini">bajo 6,0</span>':""}
      </td>
      <td><span class="chip ${x.tier.toLowerCase()}">${x.tier}</span></td>
      <td class="criterion-cell">${x.tk}</td>
      <td class="scorecell${s<ALERT?" low":""}">${num(s)}${stars(s)}</td>
      <td>${miniRadar(x)}</td>
      ${x.sc.map(v=>`<td class="criterion-cell">${v}${stars(v)}</td>`).join("")}
    </tr>`};
  $("list").innerHTML=`<section class="idea-group">
    <div class="table-top"><h2>${r.length===P.d.length?"Las "+r.length:"Selección de "+r.length} · 8 criterios</h2>
    <div class="idea-group-note">Toca una columna para ordenar · pasa el mouse por la araña</div></div>
    <div class="idea-table-wrap"><table class="idea-table">${header}<tbody>${r.map(row).join("")}</tbody></table></div>
  </section>`;
  bindTips();
}
function critCell(i){
  const c=C[i];
  return `<button class="critname" data-c="${i}">${esc(c.label)}<span class="critw">Peso ${c.weight}%</span></button>`;
}
/* ---- glosario con hover: x.hv = [[frase, explicacion], ...]. Primera aparicion por campo,
   frases largas primero, con marcador para q una frase no re-matchee dentro de otra. */
function hvText(x,txt){
  let out=esc(txt||"");
  if(!x.hv||!x.hv.length)return out;
  const idx=P.d.indexOf(x);
  const keys=x.hv.map((h,i)=>[esc(h[0]),i]).sort((a,b)=>b[0].length-a[0].length);
  keys.forEach(([k,i])=>{const at=out.indexOf(k);if(at<0)return;
    out=out.slice(0,at)+"\u0001"+i+"\u0002"+out.slice(at+k.length)});
  return out.replace(/\u0001(\d+)\u0002/g,(_,i)=>`<button type="button" class="hv" data-hv="${idx}:${i}">${esc(x.hv[+i][0])}</button>`);
}
function detail(i){
  const x=P.d[i];if(!x)return location.hash="";
  const s=score(x);const H=t=>hvText(x,t);
  $("detail").innerHTML=`
    <button class="back" onclick="location.hash=''">← Volver</button>
    <div class="dhead"><h1>${esc(x.n)}</h1><div class="sub">${esc(x.g)}</div></div>
    <div class="dchips">
      <span class="chip ${x.tier.toLowerCase()}">${TIERN[x.tier]}</span>
      <span class="chip">${esc(x.cat)}</span>
      <span class="chip">${x.tk}</span>
      <span class="chip">${H(x.et)}</span>
    </div>
    <p class="dq">${H(x.q)}</p>
    <div class="scorebox">
      <div><div class="big${s<ALERT?" low":""}">${num(s)}</div><div class="u">Puntaje ponderado</div></div>
      ${radarSVG([{vals:avgVals(),col:"#c4c4c4",dash:1},{vals:x.sc,col:"#1d4ed8"}],190,1)}
    </div>
    <div class="blk claude"><h3>Lo q dice Claude</h3><p class="pre">${H(x.cm)}</p></div>
    <h2 style="margin-top:26px">La evaluación · pasa el mouse por cada criterio</h2>
    <div class="tblwrap"><table class="tbl crit">
      <tr><th>Criterio</th><th>Nota</th><th>Por qué</th></tr>
      ${C.map((c,j)=>`<tr>
        <td>${critCell(j)}</td>
        <td><span class="bar"><span class="track"><span class="fill${x.sc[j]<5?" low":""}" style="width:${x.sc[j]*10}%"></span></span><span class="v">${x.sc[j]}</span></span></td>
        <td>${H(x.jz[j])}</td></tr>`).join("")}
    </table></div>
    <div class="blk"><h3>Por qué nos suma</h3><p class="pre">${H(x.why)}</p></div>
    <div class="blk risk"><h3>La pega</h3><p class="pre">${H(x.rk)}</p></div>
    <div class="tblwrap"><table class="tbl facts">
      <tr><th>Precio estimado</th><td class="pre">${H(x.pr)}</td></tr>
      <tr><th>Última ronda</th><td>${H(x.r)}</td></tr>
      <tr><th>Total levantado</th><td>${H(x.tot)}</td></tr>
      <tr><th>Tracción</th><td>${H(x.tr)}</td></tr>
      <tr><th>Inversores</th><td>${H(x.inv)}</td></tr>
      ${(x.fx||[]).map(f=>`<tr><th>${esc(f[0])}</th><td class="pre">${H(f[1])}</td></tr>`).join("")}
    </table></div>
    <div class="links">
      <a href="${esc(x.w)}" target="_blank" rel="noopener">El sitio de ellos ↗</a>
      <a href="${esc(x.u)}" target="_blank" rel="noopener">De dónde saqué el dato de plata ↗</a>
    </div>
    <footer class="site-footer">${P.foot}</footer>`;
  bindTips();
}
function method(){
  $("method").innerHTML=
    `<div class="ctxgrid">`+P.ctx.map(c=>`<div><span>${esc(c[0])}</span><p>${c[1]}</p></div>`).join("")+`</div>`+
    `<p><b>Los 8 criterios y su peso</b>, los mismos de Ideas 2027 sin tocar. Pasa el mouse por cada uno:</p>`+
    `<div class="wgrid">`+C.map((c,i)=>`<button class="critname wgrid-b" data-c="${i}" style="border-bottom:0"><span class="wn">${esc(c.short)}</span><span class="wv">${c.weight}</span></button>`).join("")+`</div>`+
    P.method.map(p=>`<p>${p}</p>`).join("");
  bindTips();
}
/* ---- tooltips ----
   Un solo listener delegado en el documento: sobrevive a que la tabla se vuelva a
   dibujar al ordenar o filtrar. El globo se pone AL LADO del elemento, nunca debajo
   del cursor, y el cierre tiene 220 ms de gracia para poder entrar al globo. */
const tip=$("tip");
const SEL=".radarbtn,.critname,.sortbtn[data-c],.hv";
let closeT=null,openEl=null;

function fillCrit(btn){
  const c=C[+btn.dataset.c];
  tip.innerHTML=`<h4>${esc(c.label)}</h4><div class="w">Peso ${c.weight}% · escala 0 a 10</div>
    <div class="d">${esc(c.desc)}</div><div class="e">Ejemplo: ${esc(c.example)}</div>
    <div class="h">${esc(c.help)}</div>
    <div class="h" style="border-top:0;padding-top:5px"><b>Leído para comprar:</b> ${esc(c.buy)}</div>`;
}
function fillRadar(btn){
  const x=P.d[+btn.dataset.r],s=score(x);
  tip.innerHTML=`<h4>${esc(x.n)}</h4><div class="w">Total ${num(s)} · el punteado es el promedio del radar</div>`+
    C.map((c,i)=>`<div class="tipitem"><b>${esc(c.short)} · ${x.sc[i]} · peso ${c.weight}%</b><span>${esc(x.jz[i])}</span></div>`).join("");
}
function fillHv(btn){
  const [xi,hi]=btn.dataset.hv.split(":").map(Number),x=P.d[xi],h=x.hv[hi];
  tip.innerHTML=`<h4>${esc(h[0])}</h4><div class="w">${esc(x.n)} · del Form C</div><div class="d pre">${esc(h[1])}</div>`;
}
function place(el){
  const r=el.getBoundingClientRect();
  tip.style.left="-9999px";tip.style.top="0px";
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let l=r.right+12;
  if(l+w>innerWidth-12)l=r.left-w-12;
  if(l<12)l=Math.max(12,Math.min(r.left,innerWidth-w-12));
  let t=r.top+r.height/2-h/2;
  t=Math.max(12,Math.min(t,innerHeight-h-12));
  tip.style.left=l+"px";tip.style.top=t+"px";
}
function openTip(el){
  clearTimeout(closeT);
  if(openEl===el&&tip.classList.contains("show"))return;
  openEl=el;
  el.dataset.hv!=null?fillHv(el):el.dataset.r!=null?fillRadar(el):fillCrit(el);
  tip.classList.add("show");place(el);
}
function closeTip(now){
  clearTimeout(closeT);
  if(now){tip.classList.remove("show");openEl=null;return}
  closeT=setTimeout(()=>{tip.classList.remove("show");openEl=null},220);
}
document.addEventListener("pointerover",e=>{
  const t=e.target.closest&&e.target.closest(SEL);
  if(t){openTip(t);return}
  if(e.target.closest&&e.target.closest("#tip")){clearTimeout(closeT);return}
  if(openEl)closeTip();
});
tip.addEventListener("pointerleave",()=>closeTip());
document.addEventListener("focusin",e=>{
  const t=e.target.closest&&e.target.closest(SEL);
  if(t)openTip(t);else if(openEl)closeTip(1);
});
document.addEventListener("click",e=>{
  const t=e.target.closest&&e.target.closest(SEL);
  if(!t||t.classList.contains("sortbtn"))return;   /* la cabecera ordena, no abre globo */
  if(t.classList.contains("radarbtn")){e.stopPropagation();e.preventDefault()}
  else if(t.classList.contains("critname")||t.classList.contains("hv"))e.preventDefault();
  openEl===t&&tip.classList.contains("show")?closeTip(1):openTip(t);
});
addEventListener("keydown",e=>{if(e.key==="Escape")closeTip(1)});
addEventListener("scroll",()=>closeTip(1),{passive:true});
addEventListener("resize",()=>closeTip(1));
function bindTips(){closeTip(1)}

function route(){
  const m=(location.hash||"").match(/^#s(\d+)$/);
  if(m){detail(+m[1]);$("home").classList.add("hide");$("detail").classList.remove("hide");scrollTo(0,0)}
  else{$("home").classList.remove("hide");$("detail").classList.add("hide");closeTip(1)}
}
addEventListener("hashchange",()=>{if(P)route()});

const inp=$("pinInput"),err=$("pinErr");
async function tryPw(pw,silent){
  try{const d=await unlock(pw);sessionStorage.setItem(KEYNAME,pw);boot(d);return true}
  catch(e){if(!silent){err.classList.add("show");inp.value="";inp.focus()}return false}
}
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){err.classList.remove("show");tryPw(inp.value)}});
inp.addEventListener("input",()=>{err.classList.remove("show");if(inp.value.length>=6)tryPw(inp.value,true)});
(async()=>{const s=sessionStorage.getItem(KEYNAME);if(s&&await tryPw(s,true))return;inp.focus()})();
</script>
</body>
