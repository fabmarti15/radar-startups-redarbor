<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Radar · Startups para Redarbor</title>
<style>
  :root{
    --bg:#fbfaf7;--surface:#fff;--text:#2f3835;--muted:#6f7b76;--soft:#9ba7a2;
    --line:#e4eae6;--accent:#789985;--accent2:#9b90b3;--accentSoft:#edf5ef;
    --red:#c47782;--green:#668d79;--amber:#b08d5b
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(circle at 8% 0,rgba(223,236,227,.8) 0,transparent 27%),
      radial-gradient(circle at 96% 4%,rgba(235,231,244,.75) 0,transparent 25%),
      radial-gradient(circle at 72% 86%,rgba(247,232,219,.45) 0,transparent 24%),
      var(--bg);
    color:var(--text);font:15px/1.6 -apple-system,'Helvetica Neue',sans-serif;padding:26px 20px 90px
  }
  .wrap{max-width:640px;margin:0 auto}
  .hide{display:none!important}
  h1{font-family:Georgia,serif;font-size:28px;font-weight:400;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  section{margin-top:34px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#7d8984;font-weight:600;padding-bottom:5px;margin-bottom:6px}
  .mode{font-size:11px;color:var(--soft);margin-top:6px}

  #pin{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center}
  #pin .box{text-align:center;padding:20px}
  #pin input{border:1px solid var(--line);border-radius:12px;padding:13px;font-size:17px;text-align:center;width:200px;background:#fff;margin-top:14px;font-family:inherit}
  #pin .err{color:var(--red);font-size:13px;margin-top:8px;visibility:hidden}
  #pin .err.show{visibility:visible}
  #pin .cry{margin-top:20px;font-size:10.5px;color:var(--soft);letter-spacing:.4px}

  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(55,69,62,.05);padding:2px}
  .kpi{padding:13px 4px;text-align:center;border-radius:13px}
  .kpi .n{font-family:Georgia,serif;font-size:26px;color:#648471;display:block}
  .kpi.alert .n{color:var(--red)}
  .kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
  .home-kpis{margin-top:22px}

  .filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .fchip{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.6);cursor:pointer;font-family:inherit}
  .fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  select{font:inherit;font-size:12px;color:var(--muted);background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:20px;padding:5px 9px;cursor:pointer}
  .fcount{font-size:11px;color:var(--soft);margin-left:auto}

  .idea-groups{margin-top:24px}
  .idea-group{margin-top:24px}
  .idea-group:first-child{margin-top:0}
  .idea-group-note{font-size:11px;color:var(--soft)}
  .table-top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:8px}
  .table-top h2{margin:0;padding-bottom:0}
  .idea-table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 10px 34px rgba(55,69,62,.06)}
  .idea-table{width:100%;min-width:940px;border-collapse:separate;border-spacing:0;font-size:12px}
  .idea-table th{position:relative;background:#f1f5f2;color:#66736d;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
  .idea-table th,.idea-table td{padding:9px 8px;text-align:center;border-right:1px solid #edf1ee;border-bottom:1px solid var(--line)}
  .idea-table th:last-child,.idea-table td:last-child{border-right:0}
  .idea-table tbody tr:last-child td{border-bottom:0}
  .idea-table tbody tr{cursor:pointer}
  .idea-table tbody tr:hover td,.idea-table tbody tr:hover .idea-col{background:#f1f7f3}
  .idea-table tbody tr.alertrow td:first-child{box-shadow:inset 3px 0 0 var(--red)}
  .idea-table .idea-col{text-align:left;position:sticky;left:0;z-index:3;background:#fff;min-width:150px;max-width:170px;padding-left:9px}
  .idea-table th.idea-col{z-index:5;background:#f1f5f2}
  .idea-name{font-size:11.5px;line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--text)}
  .idea-sub{display:block;font-size:9px;color:var(--soft);font-weight:400;margin-top:1px}
  .alertmini{display:block;color:var(--red);font-size:9px;margin-top:2px}
  .sortbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:inherit;font:inherit;font-weight:600;padding:0;cursor:pointer}
  .sortbtn.active{color:#638573}
  .scorecell{font-family:Georgia,serif;font-size:15px;color:#638573}
  .scorecell.low{color:var(--red)}
  .star{color:#f59e0b;font-size:9px;margin-left:2px;vertical-align:2px}
  .criterion-cell{color:#4f4a42}
  .idea-table svg.radar{width:54px;height:54px;margin:auto}
  .rwrap{display:inline-block}
  .radarbtn{display:block;border:0;background:none;padding:0;color:inherit;cursor:pointer;border-radius:8px}
  .radarbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  svg.radar{display:block;flex-shrink:0}
  .tipitem{position:relative;padding:5px 0 5px 12px}
  .tipitem:before{content:'•';position:absolute;left:0;color:var(--accent)}
  .tipitem b{display:block;color:var(--text);font-weight:600}
  .tipitem span{display:block;color:var(--muted)}
  .tipitem em{display:block;color:var(--soft);font-style:normal;margin-top:2px}
  .chip{font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);flex-shrink:0;display:inline-block}
  .chip.a{color:var(--green);border-color:var(--green)}
  .chip.b{color:var(--amber);border-color:#d5c2a0}
  .chip.c{color:var(--soft)}
  .empty{color:var(--soft);font-size:13.5px;padding:14px 0}

  .back{background:none;border:none;color:var(--muted);font-size:14px;padding:0 0 14px;cursor:pointer;font-family:inherit}
  .dhead h1{font-size:24px}
  .dchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .dq{margin-top:14px;font-size:14.5px;color:#414c48}
  .scorebox{display:flex;align-items:center;gap:16px;margin-top:18px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 30px rgba(55,69,62,.04)}
  .scorebox .big{font-family:Georgia,serif;font-size:44px;color:#648471;line-height:1}
  .scorebox .big.low{color:var(--red)}
  .scorebox .u{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.6px}
  .scorebox svg.radar{width:150px;height:150px;margin-left:auto}

  .tblwrap{width:100%;overflow-x:auto;margin:16px 0 0}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
  .tbl th{background:#f1f5f2;font-weight:600;color:var(--muted)}
  .tbl.facts th{width:38%}
  .crit td:first-child{width:34%}
  .crit td:last-child{color:#4c5854;font-size:12.5px}
  .critname{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--text);cursor:help;text-align:left;border-bottom:1px dotted var(--soft)}
  .critname:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .critw{display:block;font-size:10px;color:var(--soft);font-weight:400;text-transform:uppercase;letter-spacing:.5px}
  .bar{display:flex;align-items:center;gap:7px}
  .bar .track{flex:1;height:6px;background:#eef2ef;border-radius:4px;overflow:hidden;min-width:44px}
  .bar .fill{height:100%;background:var(--accent);border-radius:4px}
  .bar .fill.low{background:var(--red)}
  .bar .v{font-family:Georgia,serif;font-size:15px;color:var(--muted);min-width:16px;text-align:right}

  .blk{margin-top:18px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:0 8px 30px rgba(55,69,62,.04)}
  .blk h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:600;margin-bottom:6px}
  .blk.risk h3{color:var(--amber)}
  .blk.claude{background:var(--accentSoft);border-color:#d8e6dc}
  .blk p{font-size:13.5px;color:#414c48}
  .links{margin-top:18px;display:flex;flex-direction:column;gap:7px}
  .links a{font-size:12.5px;color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(120,153,133,.3);align-self:flex-start}

  #tip{position:fixed;display:none;z-index:120;width:320px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(55,69,62,.18);padding:12px 14px;font-size:12px;line-height:1.45;color:var(--text)}
  #tip.show{display:block}
  #tip h4{font-size:13px;font-weight:600;margin-bottom:2px}
  #tip .w{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:600;margin-bottom:7px}
  #tip .d{color:#4c5854;margin-bottom:7px}
  #tip .e{color:var(--muted);font-style:italic;margin-bottom:7px}
  #tip .h{color:var(--muted);font-size:11.5px;border-top:1px solid var(--line);padding-top:7px}

  .method-panel{display:block;margin-top:34px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(55,69,62,.05)}
  .method-panel summary{list-style:none;padding:14px 16px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#7d8984;font-weight:600;cursor:pointer}
  .method-panel summary::-webkit-details-marker{display:none}
  .method-panel[open] summary{border-bottom:1px solid var(--line)}
  .method-content{padding:14px 16px}
  .method-content p{font-size:13px;color:#4c5854;margin-bottom:9px}
  .method-content p b{color:var(--text)}
  .wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 16px}
  .wgrid button{background:var(--accentSoft);border:1px solid #d8e6dc;border-radius:11px;padding:9px 6px;text-align:center;cursor:help;font:inherit}
  .wgrid .wn{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#5f6d68;display:block}
  .wgrid .wv{font-family:Georgia,serif;font-size:19px;color:#648471}
  .ctxgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .ctxgrid div{background:var(--accentSoft);border-radius:11px;padding:11px 12px}
  .ctxgrid span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:#7d8984;font-weight:600;margin-bottom:4px}
  .ctxgrid p{font-size:12px;color:#4c5854;margin:0}
  .site-footer{padding:34px 0 10px;text-align:center;color:var(--soft);font-size:11.5px}
  @media(max-width:700px){
    body{padding:22px 12px 60px}
    h1{font-size:23px;line-height:1.2}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .ctxgrid,.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .fcount{margin-left:0;width:100%}
    svg.radar{width:52px;height:52px}
    .scorebox svg.radar{width:120px;height:120px}
    .crit td:first-child{width:40%}
    #tip{left:12px!important;right:12px;width:auto;bottom:12px;top:auto!important}
  }
</style>
</head>
<body>

<div id="pin">
  <div class="box">
    <h1>Radar · Startups</h1>
    <div class="sub">Contenido cifrado. Pide la clave a Fabián.</div>
    <input id="pinInput" type="password" placeholder="clave" autocomplete="off">
    <div class="err" id="pinErr">Clave incorrecta</div>
    <div class="cry">AES-256-GCM · PBKDF2-SHA256 · 200.000 iteraciones</div>
  </div>
</div>

<div class="wrap hide" id="home">
  <h1>Radar · Startups para Redarbor</h1>
  <div class="sub">Evaluadas con el framework de Ideas 2027</div>
  <div class="mode" id="mode"></div>
  <section class="home-kpis"><div class="kpis" id="kpis"></div></section>
  <section>
    <h2>Filtrar y ordenar</h2>
    <div class="filters" id="filters"></div>
  </section>
  <section class="idea-groups"><div id="list"></div></section>
  <details class="method-panel">
    <summary>Framework, contexto y límites</summary>
    <div class="method-content" id="method"></div>
  </details>
  <footer class="site-footer" id="foot"></footer>
</div>

<div class="wrap hide" id="detail"></div>
<div id="tip"></div>

const KEYNAME="radar_redarbor_pw";
let P=null,C=null,W=null,SHORT=null;

async function unlock(pw){
  const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},k,ct)));
}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>n.toFixed(1).replace(".",",");
const TIERN={A:"A · Mover ahora",B:"B · Vigilar",C:"C · Solo alianza"};
const TIERNOTE={A:"Precio alcanzable y encaje directo con un hueco real del grupo.",B:"Vale la conversación exploratoria, pero hay algo que resolver antes.",C:"Fuera de alcance para comprar: cabe como alianza, fusión o minoritaria."};
const TKO={Digerible:0,Medio:1,Grande:2},TRO={A:0,B:1,C:2};
const ALERT=6;
const st={tk:"Todos",geo:"Todas",cat:"Todas",sort:"score"};
const score=x=>x.sc.reduce((a,v,i)=>a+v*W[i],0)/100;

/* ---- radar, calcado del framework de Ideas 2027 ---- */
function radarSVG(polys,size,labels){
  const Wd=size||120,cx=Wd/2,cy=Wd/2*(labels?0.94:1),R=Wd/2*(labels?0.62:0.86),N=C.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return (cx+Math.cos(a)*R*v/10).toFixed(1)+","+(cy+Math.sin(a)*R*v/10).toFixed(1)};
  let h="";
  for(let r=2.5;r<=10;r+=2.5)h+='<polygon fill="none" stroke="#eceae4" points="'+[...Array(N).keys()].map(i=>pt(i,r)).join(" ")+'"/>';
  if(labels)C.forEach((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/N;
    h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(a)*R).toFixed(1)+'" y2="'+(cy+Math.sin(a)*R).toFixed(1)+'" stroke="#eceae4"/>';
    const lx=cx+Math.cos(a)*(R+15),ly=cy+Math.sin(a)*(R+15);
    const anc=Math.abs(Math.cos(a))<.3?"middle":(Math.cos(a)>0?"start":"end");
    h+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="'+anc+'" font-size="9" fill="#9b968d">'+SHORT[i]+'</text>';});
  polys.forEach(p=>{if(!p.vals.some(v=>v>0))return;
    h+='<polygon points="'+p.vals.map((v,i)=>pt(i,v||0)).join(" ")+'" fill="'+p.col+'" fill-opacity="'+(p.dash?0:0.10)+'" stroke="'+p.col+'" stroke-width="1.5"'+(p.dash?' stroke-dasharray="4 3"':"")+'/>';});
  return '<svg class="radar" viewBox="0 0 '+Wd+' '+Wd+'">'+h+'</svg>';
}
const avgVals=()=>C.map((_,i)=>P.d.reduce((a,x)=>a+x.sc[i],0)/P.d.length);

function boot(data){
  P=data;C=P.crit;W=C.map(c=>c.weight);SHORT=C.map(c=>c.short);
  $("pin").classList.add("hide");
  $("mode").textContent="Evaluación de Claude · agosto 2026 · un solo evaluador, sin promediar con nadie";
  $("foot").textContent=P.foot;
  kpis();filters();method();route();
}
function kpis(){
  const d=P.d,sc=d.map(score);
  const k=[[d.length,"en el radar"],[num(sc.reduce((a,b)=>a+b,0)/sc.length),"promedio"],
    [sc.filter(v=>v>=7).length,"sobre 7,0"],[sc.filter(v=>v<ALERT).length,"bajo 6,0",1]];
  $("kpis").innerHTML=k.map(([n,l,al])=>`<div class="kpi${al?" alert":""}"><span class="n">${n}</span><div class="l">${l}</div></div>`).join("");
}
function filters(){
  const uniq=key=>[...new Set(P.d.map(x=>x[key]))].sort();
  let h="";
  ["Todos","Digerible","Medio","Grande"].forEach(v=>{h+=`<button class="fchip" data-v="${v}" aria-pressed="${st.tk===v}">${v}</button>`});
  h+=`<select data-k="geo">`+["Todas",...uniq("geo")].map(v=>`<option${st.geo===v?" selected":""}>${v}</option>`).join("")+`</select>`;
  h+=`<select data-k="cat">`+["Todas",...uniq("cat")].map(v=>`<option${st.cat===v?" selected":""}>${esc(v)}</option>`).join("")+`</select>`;
  h+=`<span class="fcount" id="fcount"></span>`;
  const f=$("filters");f.innerHTML=h;
  f.querySelectorAll(".fchip").forEach(b=>b.onclick=()=>{st.tk=b.dataset.v;filters()});
  f.querySelectorAll("select").forEach(s=>s.onchange=()=>{st[s.dataset.k]=s.value;list()});
  list();
}
const match=x=>(st.tk==="Todos"||x.tk===st.tk)&&(st.geo==="Todas"||x.geo===st.geo)&&(st.cat==="Todas"||x.cat===st.cat);
const stars=v=>v>8?'<span class="star">★</span>':"";

/* ---- tabla del home, calcada de la idea-table de Ideas 2027 ---- */
let sortKey="total",sortDir="desc";
function sortHeader(key,label,crit){
  const active=sortKey===key,arrow=active?(sortDir==="desc"?"↓":"↑"):"";
  return `<button class="sortbtn${active?" active":""}"${crit!=null?` data-c="${crit}"`:""} onclick="sortTableBy(event,'${key}')">${label} <span>${arrow}</span></button>`;
}
function sortTableBy(e,key){
  e.stopPropagation();
  if(sortKey===key)sortDir=sortDir==="desc"?"asc":"desc";else{sortKey=key;sortDir=key==="n"?"asc":"desc"}
  list();
}
function sortVal(x,key){
  if(key==="total")return score(x);
  if(key==="n")return x.n.toLowerCase();
  if(key==="tier")return -TRO[x.tier];
  if(key==="tk")return -TKO[x.tk];
  return x.sc[C.findIndex(c=>c.id===key)];
}
function miniRadar(x){
  return `<span class="rwrap"><button type="button" class="radarbtn" data-r="${P.d.indexOf(x)}" aria-label="Ver desglose de ${esc(x.n)}">`+
    radarSVG([{vals:avgVals(),col:"#c3ccc7",dash:1},{vals:x.sc,col:"#789985"}],120,0)+`</button></span>`;
}
function list(){
  const r=P.d.filter(match);
  const dir=sortDir==="desc"?-1:1;
  r.sort((a,b)=>{const va=sortVal(a,sortKey),vb=sortVal(b,sortKey);
    return (typeof va==="string"?va.localeCompare(vb):va-vb)*dir||a.n.localeCompare(b.n)});
  const fc=$("fcount");if(fc)fc.textContent=r.length+" de "+P.d.length;
  if(!r.length){$("list").innerHTML='<div class="empty">Ninguna compañía cumple ese cruce de filtros.</div>';return}
  const heads=C.map((c,i)=>`<th>${sortHeader(c.id,esc(c.short),i)}</th>`).join("");
  const header=`<thead><tr><th class="idea-col">${sortHeader("n","Compañía")}</th>`+
    `<th>${sortHeader("tier","Prior.")}</th><th>${sortHeader("tk","Ticket")}</th>`+
    `<th>${sortHeader("total","Total")}</th><th>Araña</th>${heads}</tr></thead>`;
  const row=x=>{const s=score(x),idx=P.d.indexOf(x);
    return `<tr onclick="location.hash='s${idx}'" class="${s<ALERT?"alertrow":""}">
      <td class="idea-col" title="${esc(x.n)} · ${esc(x.q)}">
        <span class="idea-name">${esc(x.n)}</span>
        <span class="idea-sub">${esc(x.g)} · ${esc(x.cat)}</span>
        ${s<ALERT?'<span class="alertmini">Bajo 6,0</span>':""}
      </td>
      <td><span class="chip ${x.tier.toLowerCase()}">${x.tier}</span></td>
      <td class="criterion-cell">${x.tk}</td>
      <td class="scorecell${s<ALERT?" low":""}">${num(s)}${stars(s)}</td>
      <td>${miniRadar(x)}</td>
      ${x.sc.map(v=>`<td class="criterion-cell">${v}${stars(v)}</td>`).join("")}
    </tr>`};
  $("list").innerHTML=`<section class="idea-group">
    <div class="table-top"><h2>${r.length===P.d.length?"Las 22 compañías":"Selección"} · 8 criterios</h2>
    <div class="idea-group-note">Toca una columna para ordenar · pasa el cursor por la araña</div></div>
    <div class="idea-table-wrap"><table class="idea-table">${header}<tbody>${r.map(row).join("")}</tbody></table></div>
  </section>`;
  bindTips();
}
function critCell(i){
  const c=C[i];
  return `<button class="critname" data-c="${i}">${esc(c.label)}<span class="critw">Peso ${c.weight}%</span></button>`;
}
function detail(i){
  const x=P.d[i];if(!x)return location.hash="";
  const s=score(x);
  $("detail").innerHTML=`
    <button class="back" onclick="location.hash=''">← Volver</button>
    <div class="dhead"><h1>${esc(x.n)}</h1><div class="sub">${esc(x.g)}</div></div>
    <div class="dchips">
      <span class="chip ${x.tier.toLowerCase()}">${TIERN[x.tier]}</span>
      <span class="chip">${esc(x.cat)}</span>
      <span class="chip">Ticket ${x.tk}</span>
      <span class="chip">${esc(x.et)}</span>
    </div>
    <p class="dq">${esc(x.q)}</p>
    <div class="scorebox">
      <div><div class="big${s<ALERT?" low":""}">${num(s)}</div><div class="u">Puntaje ponderado</div></div>
      ${radarSVG([{vals:avgVals(),col:"#c3ccc7",dash:1},{vals:x.sc,col:"#789985"}],190,1)}
    </div>
    <div class="blk claude"><h3>Comentario de Claude</h3><p>${esc(x.cm)}</p></div>
    <h2 style="margin-top:26px">Evaluación · pasa el cursor por cada criterio</h2>
    <div class="tblwrap"><table class="tbl crit">
      <tr><th>Criterio</th><th>Puntaje</th><th>Por qué</th></tr>
      ${C.map((c,j)=>`<tr>
        <td>${critCell(j)}</td>
        <td><span class="bar"><span class="track"><span class="fill${x.sc[j]<5?" low":""}" style="width:${x.sc[j]*10}%"></span></span><span class="v">${x.sc[j]}</span></span></td>
        <td>${esc(x.jz[j])}</td></tr>`).join("")}
    </table></div>
    <div class="blk"><h3>Por qué le suma a Redarbor</h3><p>${esc(x.why)}</p></div>
    <div class="blk risk"><h3>La pega</h3><p>${esc(x.rk)}</p></div>
    <div class="tblwrap"><table class="tbl facts">
      <tr><th>Última ronda</th><td>${esc(x.r)}</td></tr>
      <tr><th>Total levantado</th><td>${esc(x.tot)}</td></tr>
      <tr><th>Valuación</th><td>${esc(x.val)}</td></tr>
      <tr><th>Inversores</th><td>${esc(x.inv)}</td></tr>
    </table></div>
    <div class="links">
      <a href="${esc(x.w)}" target="_blank" rel="noopener">Sitio de la compañía ↗</a>
      <a href="${esc(x.u)}" target="_blank" rel="noopener">Fuente del dato de financiamiento ↗</a>
    </div>
    <footer class="site-footer">${P.foot}</footer>`;
  bindTips();
}
function method(){
  $("method").innerHTML=
    `<div class="ctxgrid">`+P.ctx.map(c=>`<div><span>${esc(c[0])}</span><p>${c[1]}</p></div>`).join("")+`</div>`+
    `<p><b>Los 8 criterios y su peso</b> — los mismos de Ideas 2027, sin tocar. Pasa el cursor por cada uno:</p>`+
    `<div class="wgrid">`+C.map((c,i)=>`<button class="critname wgrid-b" data-c="${i}" style="border-bottom:0"><span class="wn">${esc(c.short)}</span><span class="wv">${c.weight}</span></button>`).join("")+`</div>`+
    P.method.map(p=>`<p>${p}</p>`).join("");
  bindTips();
}
/* ---- tooltips ---- */
const tip=$("tip");
function showTip(btn){
  const c=C[+btn.dataset.c];
  tip.innerHTML=`<h4>${esc(c.label)}</h4><div class="w">Peso ${c.weight}% · escala 0 a 10</div>
    <div class="d">${esc(c.desc)}</div><div class="e">Ejemplo: ${esc(c.example)}</div>
    <div class="h">${esc(c.help)}</div>
    <div class="h" style="border-top:0;padding-top:5px"><b>Leído para comprar:</b> ${esc(c.buy)}</div>`;
  tip.classList.add("show");place(btn);
}
function showRadarTip(btn){
  const x=P.d[+btn.dataset.r],s=score(x);
  tip.innerHTML=`<h4>${esc(x.n)}</h4><div class="w">Total ${num(s)} · línea punteada = promedio del radar</div>`+
    C.map((c,i)=>`<div class="tipitem"><b>${esc(c.short)} · ${x.sc[i]} · peso ${c.weight}%</b><span>${esc(x.jz[i])}</span></div>`).join("");
  tip.classList.add("show");place(btn);
}
function place(btn){
  const r=btn.getBoundingClientRect(),tw=Math.min(320,innerWidth-24);
  let l=Math.min(Math.max(12,r.left),innerWidth-tw-12),t=r.bottom+8;
  if(t+tip.offsetHeight>innerHeight-12)t=Math.max(12,r.top-tip.offsetHeight-8);
  tip.style.left=l+"px";tip.style.top=t+"px";
}
const hideTip=()=>tip.classList.remove("show");
function bindTips(){
  document.querySelectorAll(".critname,.sortbtn[data-c]").forEach(b=>{
    b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;
    b.onfocus=()=>showTip(b);b.onblur=hideTip;
  });
  document.querySelectorAll(".critname").forEach(b=>{
    b.onclick=e=>{e.preventDefault();tip.classList.contains("show")?hideTip():showTip(b)};
  });
  document.querySelectorAll(".radarbtn").forEach(b=>{
    b.onmouseenter=()=>showRadarTip(b);b.onmouseleave=hideTip;
    b.onfocus=()=>showRadarTip(b);b.onblur=hideTip;
    b.onclick=e=>{e.stopPropagation();e.preventDefault();tip.classList.contains("show")?hideTip():showRadarTip(b)};
  });
}
addEventListener("scroll",hideTip,{passive:true});
addEventListener("resize",hideTip);

function route(){
  const m=(location.hash||"").match(/^#s(\d+)$/);
  if(m){detail(+m[1]);$("home").classList.add("hide");$("detail").classList.remove("hide");scrollTo(0,0)}
  else{$("home").classList.remove("hide");$("detail").classList.add("hide");hideTip()}
}
addEventListener("hashchange",()=>{if(P)route()});

const inp=$("pinInput"),err=$("pinErr");
async function tryPw(pw,silent){
  try{const d=await unlock(pw);sessionStorage.setItem(KEYNAME,pw);boot(d);return true}
  catch(e){if(!silent){err.classList.add("show");inp.value="";inp.focus()}return false}
}
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){err.classList.remove("show");tryPw(inp.value)}});
inp.addEventListener("input",()=>{err.classList.remove("show");if(inp.value.length>=6)tryPw(inp.value,true)});
(async()=>{const s=sessionStorage.getItem(KEYNAME);if(s&&await tryPw(s,true))return;inp.focus()})();
</script>
